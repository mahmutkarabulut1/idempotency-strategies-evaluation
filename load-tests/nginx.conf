worker_processes auto;
events { worker_connections 4096; }

http {
    # Round-robin across the three JVM instances so the same idempotency key
    # can race across processes. keepalive keeps connections hot under load.
    upstream idem_backend {
        server svc1:8080;
        server svc2:8080;
        server svc3:8080;
        keepalive 256;
    }

    access_log off;

    server {
        listen 8080;

        location / {
            proxy_pass http://idem_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
