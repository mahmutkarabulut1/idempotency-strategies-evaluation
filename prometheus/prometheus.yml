global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: idem-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["svc1:8080", "svc2:8080", "svc3:8080"]
        labels:
          tier: application

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
